name = "cheeky_tester"
version = "1.0.0"
target = "javascript"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
lustre = "5.7.1"
gossamer = "10.0.0"
gleam_fetch = "1.4.1"
gleam_javascript = "1.0.1"
gleam_http = "4.5.0"
